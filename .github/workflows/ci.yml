# The split grammar's gates [ts-split in the main repo's DECISIONS]:
# generate-clean, manifest agreement at the tracked weir ref, and the
# zero-ERROR corpus bar — the tree-sitter third of the inventory gates
# that stayed behind when this repo split out.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: fetch weir at the tracked ref (anonymous — weir must be public)
        # a plain shallow fetch, not actions/checkout: the workflow token
        # is scoped to THIS repo, so a cross-repo checkout of a private
        # weir 404s. If this step fails with auth/404, the cause is
        # weir-shell/weir's visibility, not the ref.
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/weir-shell/weir weir-ref
          cd weir-ref
          git fetch --depth 1 origin "$(cat ../TRACKED_WEIR_REF)"
          git checkout FETCH_HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: gates
        run: ./ci/check.sh weir-ref
