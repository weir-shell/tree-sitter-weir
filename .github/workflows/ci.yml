# The split grammar's gates [ts-split in the main repo's DECISIONS]:
# generate-clean, manifest agreement, and the zero-ERROR corpus bar —
# the tree-sitter third of the inventory gates that stayed behind when
# this repo split out.
#
# THE SUBJECT IS NOT FROZEN [grammar-currency in the main repo's
# DECISIONS]: this repo targets a weir RELEASE (TARGET_WEIR_RELEASE), and
# currency is a comparison against weir's releases/latest — a number,
# assertable, unlike two unordered SHAs. Pre-first-release the target is
# `main` and the checkout follows weir main as it moves, so drift goes
# red at the next run instead of staying green against a pinned past.
# The triggers close the never-runs window: weir dispatches here when
# its grammar manifest changes, and the weekly cron catches anything the
# dispatch misses.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # weir's grammar-manifest change dispatch — the check runs at the
  # exact moment it could newly fail
  repository_dispatch:
    types: [weir-manifest-changed]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # currency first: the cheapest check, and the one the other gates
      # cannot see. releases/latest is a plain public fetch (no token).
      - name: currency — the target IS weir's latest release
        run: |
          target=$(cat TARGET_WEIR_RELEASE)
          # parsed, never line-scraped: the API may answer compact JSON,
          # where a grep|cut scrape yields whichever field is fourth
          latest=$(curl -fsSL -H 'User-Agent: tree-sitter-weir-ci' \
            https://api.github.com/repos/weir-shell/weir/releases/latest 2>/dev/null \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name",""))' 2>/dev/null || true)
          if [ -z "$latest" ]; then
            [ "$target" = "main" ] \
              && echo "pre-first-release: no weir release yet, target=main tracks weir main (currency = the moving checkout below)" \
              || { echo "TARGET_WEIR_RELEASE says '$target' but weir has no releases — pre-first-release the target must be 'main'" >&2; exit 1; }
          elif [ "$target" = "$latest" ]; then
            echo "current: targeting $target == weir releases/latest"
          else
            echo "STALE: this grammar targets '$target' but weir's latest release is '$latest' — refresh the grammar against $latest and bump TARGET_WEIR_RELEASE" >&2
            exit 1
          fi
      - name: fetch weir at the target (anonymous — weir must be public)
        # a plain shallow fetch, not actions/checkout: the workflow token
        # is scoped to THIS repo, so a cross-repo checkout of a private
        # weir 404s. If this step fails with auth/404, the cause is
        # weir-shell/weir's visibility, not the target.
        run: |
          target=$(cat TARGET_WEIR_RELEASE)
          git clone --no-checkout --filter=blob:none https://github.com/weir-shell/weir weir-ref
          cd weir-ref
          git fetch --depth 1 origin "$target"
          git checkout FETCH_HEAD
      # when targeting a RELEASE, the manifest comes from the release
      # ASSET — the published interface, the way the site consumes the
      # generated installer — and must agree with the tag's checkout
      - name: manifest from the release asset (release-targeted only)
        run: |
          target=$(cat TARGET_WEIR_RELEASE)
          [ "$target" = "main" ] && { echo "target=main: manifest read from the checkout"; exit 0; }
          curl -fsSL -o asset-manifest.json \
            "https://github.com/weir-shell/weir/releases/download/$target/grammar-manifest.json"
          diff asset-manifest.json weir-ref/editors/grammar-manifest.json \
            || { echo "the release asset manifest differs from the tag checkout's — the release is inconsistent" >&2; exit 1; }
          cp asset-manifest.json weir-ref/editors/grammar-manifest.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: gates
        run: ./ci/check.sh weir-ref
